server:
  port: 8080

spring:
  application:
    name: medassistant
  datasource:
    url: jdbc:h2:mem:medassistant_db
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

# LM Studio конфигурация
lmstudio:
  base-url: http://localhost:1234
  model: local-model
  # Для продакшена замените на ваш адрес LM Studio
  # Пример: http://192.168.1.100:1234/v1

# Настройки приложения
app:
  clinic-name: Медицинская клиника
  max-survey-age-days: 7
