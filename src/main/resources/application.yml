server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/medassistant_db  # было: jdbc:h2:mem:medassistant_db
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update  # было: update (оставьте)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

# LM Studio конфигурация
lmstudio:
  base-url: http://10.0.3.10:1234
  model: gemma-2-2b-it

# Настройки приложения
app:
  clinic-name: Медицинская клиника
  max-survey-age-days: 7